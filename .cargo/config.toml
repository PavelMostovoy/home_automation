[build]
target = "xtensa-esp32s3-espidf"

[target.xtensa-esp32s3-espidf]
linker = "ldproxy"
runner = "espflash flash --monitor"
rustflags = ["--cfg", "espidf_time64"]

[unstable]
build-std = ["std", "panic_abort"]

[env]
MCU = "esp32s3"
ESP_IDF_VERSION = "v5.3.4"
# "workspace" = ESP-IDF + its tools are downloaded into ./.embuild (project-local).
# Never use "global": it writes into ~/.espressif.
ESP_IDF_TOOLS_INSTALL_DIR = "workspace"
