[package]
name = "home_automation"
version = "0.1.0"
edition = "2024"
resolver = "2"
rust-version = "1.85"

[[bin]]
name = "home_automation"
harness = false # no test harness on target; host-side unit tests live in pure modules

[profile.release]
opt-level = "s"

[profile.dev]
debug = true    # symbols are nice and they don't increase the size on Flash
opt-level = "z"

[features]
default = []
experimental = ["esp-idf-svc/experimental"]

[dependencies]
log = "0.4"
embedded-svc = { version = "0.29", default-features = false }
anyhow = "1"
serde = { version = "1", default-features = false, features = ["derive", "std"] }
serde_json = "1"
esp-idf-svc = { version = "0.53", features = ["critical-section"] }

[build-dependencies]
embuild = "0.33"

